name: Make hover frames (one-off)
on:
  push:
    paths: [".github/workflows/frames.yml"]
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U yt-dlp
      - name: Extract 8 frames per video
        run: |
          mkdir -p assets/frames
          ok=0; fail=0
          for id in JdYwGTit_-c 4to_bSMjv98 JYeob-Q2qRs 5VXlWdZdW1A hqw-YgsIId4 hvcm7aHr_Dc laxZ4am0Qrw cd96lB5AD2k TKK0UC2sbbE rhwQRYKQXOY WrqVQPR2veo nZM5mqWff8g 5RBhmR-tjOM FM4PBAvugTw 8EF8p7EGLOc pkkMk5IcIpE; do
            if yt-dlp -q --no-warnings -f "bv*[height<=480][ext=mp4]/bv*[height<=480]/worst" -o "/tmp/$id.%(ext)s" "https://www.youtube.com/watch?v=$id"; then
              f=$(ls /tmp/$id.* | head -1)
              d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
              for n in 1 2 3 4 5 6 7 8; do
                t=$(python3 -c "print($d*(0.06+0.88*($n-1)/7))")
                ffmpeg -v error -y -ss "$t" -i "$f" -frames:v 1 -vf "scale=640:-2" -q:v 4 "assets/frames/$id-$n.jpg"
              done
              ok=$((ok+1)); rm -f "$f"
            else
              echo "FAILED $id"; fail=$((fail+1))
            fi
          done
          echo "ok=$ok fail=$fail"
          ls assets/frames | wc -l
      - name: Commit and remove this one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/frames.yml
          git add -A
          git commit -m "Add hover frames for YouTube projects"
          git push
