name: Hover frames from storyboards (one-off)
on:
  push:
    paths: [".github/workflows/sb.yml"]
permissions:
  contents: write
jobs:
  sb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cut frames
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, io, os
          from PIL import Image
          plan=json.load(open('.github/sb.json')); os.makedirs('assets/frames',exist_ok=True); cache={}
          for vid,p in plan.items():
              for n,(m,x,y) in enumerate(p['f'],1):
                  url=f"https://i.ytimg.com/sb/{vid}/storyboard3_L3/M{m}.jpg?"+urllib.parse.urlencode({'sqp':p['q'],'sigh':p['s']})
                  if url not in cache:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      cache[url]=Image.open(io.BytesIO(urllib.request.urlopen(req,timeout=30).read())).convert('RGB')
                  cache[url].crop((x,y,x+p['w'],y+180)).save(f"assets/frames/{vid}-{n}.jpg",quality=88)
              print('ok',vid)
          PY
          ls assets/frames | wc -l
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/sb.yml .github/sb.json
          git add -A
          git commit -m "Add hover frames from YouTube storyboards"
          git push
